<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fffaf6">
  <meta name="description" content="Tudo em Dia: seu espaço para organizar contas, compras, metas, desejos e saúde.">
  <title>Tudo em Dia | Lumanoids</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Tudo em Dia">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#222733;background:#fffaf6;font-synthesis:none}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 0 0,#ffe1d0 0,transparent 22rem),linear-gradient(155deg,#fffaf6,#fff 60%,#fff6f0)}
    .shell{position:relative;max-width:720px;margin:0 auto;padding:42px 20px 28px;overflow:hidden}
    .shell:before{content:"";position:absolute;width:240px;height:240px;border-radius:50%;background:#ff9c67;top:-160px;left:-95px;z-index:0;opacity:.85}
    header{position:relative;text-align:center;margin:16px 0 30px}h1{font-size:clamp(45px,10vw,76px);font-weight:900;line-height:.98;letter-spacing:-.075em;margin:0}h1 span{display:inline;color:#ff672f;letter-spacing:-.065em}.underline{width:116px;height:7px;background:#ffb27f;border-radius:50%;margin:15px auto 0;transform:rotate(-3deg)}
    .grid{position:relative;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
    .tile{position:relative;min-width:0;min-height:235px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;padding:19px 15px 16px;border-radius:27px;text-decoration:none;color:inherit;border:1px solid rgba(111,79,62,.13);box-shadow:0 5px 9px rgba(64,39,26,.10),0 14px 25px rgba(64,39,26,.10);transition:transform .18s ease,box-shadow .18s ease}
    a.tile:hover{transform:translateY(-4px);box-shadow:0 8px 14px rgba(64,39,26,.16),0 18px 30px rgba(64,39,26,.14)}a.tile:focus-visible{outline:3px solid #f87542;outline-offset:3px}
    .contas{background:linear-gradient(135deg,#ffecdf,#ffe5d7)}.compras{background:linear-gradient(135deg,#eff7ed,#e7f3e7)}.metas{background:linear-gradient(135deg,#fff3e9,#fce9dc)}.desejos{background:linear-gradient(135deg,#ffedf0,#ffe2e6)}.saude{background:linear-gradient(135deg,#eaf7ff,#e3f2fc);grid-column:1/-1;min-height:155px;flex-direction:row;align-items:center;gap:12px}
    .art{height:130px;display:grid;place-items:center;filter:drop-shadow(0 12px 8px rgba(70,40,20,.09))}.art svg{width:100%;max-width:145px;height:130px}.saude .art{height:120px;flex:0 0 40%}.saude .art svg{height:120px}
    .tile-bottom{display:flex;align-items:end;justify-content:space-between;gap:5px;width:100%}.tile h2{font-size:clamp(16px,4vw,24px);font-weight:800;letter-spacing:-.05em;line-height:1.12;margin:0;overflow-wrap:break-word}.arrow{flex:0 0 35px;width:35px;height:35px;border-radius:50%;background:#ff743f;color:white;display:grid;place-items:center;box-shadow:0 3px 9px #ff743f35}.arrow svg{width:22px;height:22px}
    .ribbon{position:absolute;top:17px;right:-32px;transform:rotate(35deg);background:#e56c43;color:white;font-size:9px;letter-spacing:.02em;font-weight:800;padding:6px 31px;z-index:2;box-shadow:0 3px 8px #0001;white-space:nowrap}.disabled{cursor:not-allowed;filter:saturate(.82)}.disabled .arrow{background:#b8b7b7}.disabled h2{padding-right:5px}
    .install-area{text-align:center;margin:22px auto 0;max-width:370px}.install-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:11px;padding:16px 20px;border:0;border-radius:18px;background:#ff743f;color:white;font:800 16px Inter,system-ui,sans-serif;box-shadow:0 9px 22px #ff743f38;cursor:pointer}.install-btn svg{width:23px;height:23px}.install-btn:focus-visible{outline:3px solid #222733;outline-offset:3px}.install-help{font-size:12px;color:#77727a;line-height:1.5;margin:10px 0 0}.install-guide{display:none;text-align:left;margin-top:13px;padding:16px;background:#fff;border:1px solid #f4d6c4;border-radius:15px;font-size:13px;line-height:1.65;color:#38333a}.install-guide.show{display:block}.install-guide strong{color:#d85d29}
    footer{display:flex;align-items:center;justify-content:center;gap:12px;margin:30px 0 8px;color:#85848a;font-size:13px;white-space:nowrap}footer:before,footer:after{content:"";height:1px;background:#c9c4c0;flex:1}footer strong{color:#f36b32;font-weight:700}
    @media(min-width:580px){.shell{padding:52px 36px 34px}.grid{gap:20px}.tile{min-height:280px;padding:24px}.art{height:175px}.art svg{max-width:195px;height:170px}.saude{min-height:175px}.saude .art{flex-basis:42%}.saude .art svg{height:150px}.arrow{width:46px;height:46px;flex-basis:46px}.tile h2{font-size:26px}.ribbon{font-size:11px;right:-30px;top:20px}}
    @media(max-width:355px){.shell{padding-inline:12px}.grid{gap:10px}.tile{padding:14px 10px;min-height:205px;border-radius:22px}.art{height:115px}.art svg{height:115px}.arrow{flex-basis:30px;width:30px;height:30px}.tile h2{font-size:15px}.ribbon{font-size:8px}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
    /* Compacto e responsivo: cinco módulos visíveis em telas pequenas */
    @media(max-width:579px){
      .shell{padding:22px 13px 18px;max-width:440px}
      .shell:before{width:155px;height:155px;top:-112px;left:-72px}
      header{margin:9px 0 19px}
      h1{font-size:clamp(27px,8.3vw,39px);letter-spacing:-.065em;line-height:1.13;white-space:nowrap}
      .underline{width:88px;height:4px;margin:7px auto 0}
      .grid{gap:13px}
      .tile{min-height:174px;padding:10px 10px 12px;border-radius:19px}
      .art{height:112px;min-height:0}
      .art svg{height:108px;max-width:112px}
      .tile h2{font-size:clamp(12px,3.8vw,16px);letter-spacing:-.045em}
      .arrow{width:28px;height:28px;flex-basis:28px}
      .arrow svg{width:18px;height:18px}
      .ribbon{font-size:7px;top:12px;right:-32px;padding:5px 28px}
      .saude{min-height:103px;padding:9px 14px;gap:8px}
      .saude .art{height:87px;flex-basis:37%}
      .saude .art svg{height:86px;max-width:118px}
      footer{margin:17px 0 9px;font-size:11px}
      .install-area{margin:12px auto 0;max-width:280px}
      .install-btn{padding:11px 14px;border-radius:13px;font-size:13px;gap:8px}
      .install-btn svg{height:18px;width:18px}
      .install-help{font-size:10px;margin:6px 0 0}
    }
    @media(max-width:355px){
      .shell{padding-inline:9px}.grid{gap:10px}.tile{min-height:157px;padding:8px;border-radius:16px}
      .art{height:101px}.art svg{height:98px;max-width:103px}.tile h2{font-size:12px}
      .saude{min-height:93px}.saude .art{height:76px}.saude .art svg{height:76px}
      .arrow{width:25px;height:25px;flex-basis:25px}
    }
    @media(max-height:740px) and (max-width:579px){
      .shell{padding-top:12px}.tile{min-height:155px}.art{height:95px}.art svg{height:94px}
      .saude{min-height:90px}.saude .art{height:72px}.saude .art svg{height:72px}
      header{margin:4px 0 13px}.grid{gap:10px}
    }
    .install-area[hidden]{display:none!important}

    .top-actions{display:flex;justify-content:center;gap:7px;position:relative;z-index:2;flex-wrap:wrap}
    .top-actions button{font:600 11px Inter,system-ui,sans-serif;border:1px solid #f0d9ca;background:#fffdfb;color:#744d3a;padding:9px 11px;border-radius:999px;box-shadow:0 3px 9px #52321a12;cursor:pointer}
    .top-actions button span{font-size:15px;vertical-align:-1px;margin-right:3px}
    footer a{color:inherit;text-decoration:none}
    dialog{border:1px solid #edd7ca;border-radius:20px;width:min(92vw,440px);max-height:82dvh;overflow:auto;padding:20px;background:#fffdfa;color:#28262a;box-shadow:0 24px 75px #24180d55;font:14px/1.65 Inter,system-ui,sans-serif}
    dialog::backdrop{background:#18120d99;backdrop-filter:blur(3px)}
    .dialog-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}.dialog-head h2{margin:0;font-size:20px;line-height:1.2}.dialog-head button{border:0;background:#fff0e7;border-radius:10px;padding:9px 13px;cursor:pointer;font-size:16px}
    dialog p{margin:9px 0}dialog a{color:#c95020}
    @media(max-width:579px){.top-actions button{padding:7px 8px;font-size:10px}.top-actions button span{font-size:13px}header{margin-top:10px}}
  </style>
</head>
<body>
<main class="shell">
  <nav class="top-actions" aria-label="Informações do aplicativo"><button type="button" data-dialog="about" aria-label="Sobre o aplicativo" title="Sobre"><span aria-hidden="true">ⓘ</span> Sobre</button><button type="button" data-dialog="privacy" aria-label="Privacidade dos dados" title="Privacidade"><span aria-hidden="true">♧</span> Privacidade</button></nav><header><h1>Tudo <span>em Dia</span></h1><div class="underline" aria-hidden="true"></div></header>
  <section class="grid" aria-label="Áreas do Tudo em Dia">

      <div class="tile-bottom"><h2>Contas</h2><span class="arrow" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14m-7-7 7 7-7 7"/></svg></span></div>
    </a>
    <a class="tile compras" href="https://applumanoids.github.io/lista-compras/" target="_blank" rel="noopener noreferrer external" aria-label="Abrir Lista de Supermercado">
      <div class="art" aria-hidden="true"><svg viewBox="0 0 160 145" xmlns="http://www.w3.org/2000/svg"><path d="M44 47Q26 19 51 14q23 7 19 35M72 45Q70 9 92 16q17 13 0 37" fill="#58a443" stroke="#39883c" stroke-width="3"/><path d="M88 47Q112 15 122 37q-2 22-30 24" fill="#77b74d"/><path d="M46 50q10-30 22-10l7 20" fill="#ef9f32"/><circle cx="100" cy="59" r="20" fill="#f46b36"/><path d="M95 40l6-9 5 10" fill="#39883c"/><rect x="18" y="52" width="125" height="65" rx="8" fill="#e3e5e5" stroke="#9fa8ac" stroke-width="5"/><path d="M23 71h115M28 93h108M45 54l10 62m25-62v62m25-62-10 62" stroke="#aeb8ba" stroke-width="6"/><path d="M22 54l-8-15h-8" fill="none" stroke="#909ca0" stroke-width="7" stroke-linecap="round"/><circle cx="45" cy="127" r="9" fill="#59636b"/><circle cx="118" cy="127" r="9" fill="#59636b"/></svg></div>
      <div class="tile-bottom"><h2>Lista de<br>Supermercado</h2><span class="arrow" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14m-7-7 7 7-7 7"/></svg></span></div>
    </a>
    <a class="tile metas" href="https://applumanoids.github.io/metas/" target="_blank" rel="noopener noreferrer external" aria-label="Abrir Metas"><div class="art" aria-hidden="true"><svg viewBox="0 0 160 145" xmlns="http://www.w3.org/2000/svg"><circle cx="79" cy="76" r="58" fill="#f67940"/><circle cx="79" cy="76" r="43" fill="#fff4ec"/><circle cx="79" cy="76" r="31" fill="#f67940"/><circle cx="79" cy="76" r="18" fill="#fff4ec"/><circle cx="79" cy="76" r="7" fill="#f67940"/><path d="M80 76l56-55" stroke="#a34b23" stroke-width="7" stroke-linecap="round"/><path d="M136 21l-2 24-16-8 0-17z" fill="#ff884d"/><path d="M136 21l-23 2 7 16 16 0z" fill="#e76532"/></svg></div><div class="tile-bottom"><h2>Metas</h2><span class="arrow" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14m-7-7 7 7-7 7"/></svg></span></div></a>
    <a class="tile desejos" href="https://applumanoids.github.io/lista-de-desejos/" target="_blank" rel="noopener noreferrer external" aria-label="Abrir Desejos"><div class="art" aria-hidden="true"><svg viewBox="0 0 160 145" xmlns="http://www.w3.org/2000/svg"><path d="M39 47h79l9 78H30z" fill="#f49a8f"/><path d="M53 50V31q0-20 20-20t20 20v19" fill="none" stroke="#d8776f" stroke-width="7"/><path d="M62 81q10-13 20 0 10-13 20 0 3 10-20 25-23-15-20-25" fill="#ffe1dd"/><rect x="93" y="94" width="50" height="39" rx="5" fill="#f9cf9d"/><path d="M115 94v39M93 110h50" stroke="#dc963e" stroke-width="9"/><path d="M117 93q-30-12-15-20 10-3 15 20m0 0q26-22 31-9 3 10-31 9" fill="none" stroke="#dc963e" stroke-width="5"/><path d="M21 32l4-12 4 12 12 4-12 4-4 12-4-12-12-4zM127 36l3-9 3 9 9 3-9 3-3 9-3-9-9-3z" fill="#f9bc43"/></svg></div><div class="tile-bottom"><h2>Desejos</h2><span class="arrow" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14m-7-7 7 7-7 7"/></svg></span></div></a>
    <a class="tile saude" href="https://applumanoids.github.io/App-Saude/" target="_blank" rel="noopener noreferrer external" aria-label="Abrir Saude"><div class="art" aria-hidden="true"><svg viewBox="0 0 160 145" xmlns="http://www.w3.org/2000/svg"><path d="M73 48C40 8 5 42 23 74q14 24 50 48 36-24 50-48 18-32-16-43-19-5-34 17z" fill="#f55c62"/><path d="M30 74h20l9-18 12 36 11-23h27" fill="none" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="116" y="49" width="30" height="76" rx="10" fill="#f2a7a6"/><rect x="119" y="43" width="24" height="12" rx="4" fill="#9a7b78"/><rect x="94" y="105" width="16" height="32" rx="8" fill="#e99596" transform="rotate(-30 94 105)"/></svg></div><div class="tile-bottom"><h2>Saúde</h2><span class="arrow" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14m-7-7 7 7-7 7"/></svg></span></div></a>
  </section>
  <footer><span>Criado por <a href="https://applumanoids.github.io/sitelumanoids.com/" target="_blank" rel="noopener noreferrer"><strong>Lumanoids</strong></a></span></footer>
  <section class="install-area" aria-label="Instalar no celular">
    <button class="install-btn" id="installBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M9 21v-8h6v8"/></svg>Baixar no celular</button>
    <p class="install-help">Coloque o Tudo em Dia na tela inicial do seu celular.</p>
    <div class="install-guide" id="installGuide" role="status" aria-live="polite"></div>
  </section>
</main>
<dialog id="appDialog" aria-labelledby="dialogTitle"><div class="dialog-head"><h2 id="dialogTitle"></h2><button type="button" id="closeDialog" aria-label="Fechar">✕</button></div><div id="dialogBody"></div></dialog>
<script>

  const dialog = document.getElementById('appDialog');
  const dialogTitle = document.getElementById('dialogTitle');
  const dialogBody = document.getElementById('dialogBody');
  const pages = {
    about: ['Sobre o Tudo em Dia', `<p>O <strong>Tudo em Dia</strong> reúne cinco aplicativos Lumanoids em um só lugar: Contas, Lista de Supermercado, Metas, Desejos e Saúde.</p><p>Cada cartão abre seu próprio aplicativo, em uma navegação separada.</p><p>Desenvolvido por <a href="https://applumanoids.github.io/sitelumanoids.com/" target="_blank" rel="noopener noreferrer">Lumanoids</a>.</p>`],
    privacy: ['Privacidade e seus dados', `<p>Esta página inicial funciona como um menu de links. Não solicita cadastro nem armazena informações financeiras, de saúde ou listas de compras. O navegador pode guardar apenas uma preferência local relacionada ao botão de instalação.</p><p><strong>A preferência de instalação, quando registrada, fica no armazenamento local do navegador</strong> e não são enviados pela página a um servidor. Os aplicativos acessados têm suas próprias regras de armazenamento e privacidade.</p><p><strong>Atenção:</strong> limpar dados do site, histórico com dados de navegação ou redefinir o navegador pode apagar informações salvas localmente. Faça cópias de segurança em cada aplicativo antes de limpar o navegador.</p><p>O carregamento da fonte Inter pelo Google Fonts e o acesso aos links externos exigem internet.</p>`],
  };
  function openDialog(which){const page=pages[which];if(!page)return;dialogTitle.textContent=page[0];dialogBody.innerHTML=page[1];dialog.showModal()}
  document.querySelectorAll('[data-dialog]').forEach(b=>b.addEventListener('click',()=>openDialog(b.dataset.dialog)));
  document.getElementById('closeDialog').addEventListener('click',()=>dialog.close());
  dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close()});

  let installPrompt = null;
  const btn = document.getElementById('installBtn');
  const installArea = document.querySelector('.install-area');
  const guide = document.getElementById('installGuide');
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isSafari = /Safari/i.test(navigator.userAgent) && !/CriOS|FxiOS|EdgiOS|OPiOS|DuckDuckGo/i.test(navigator.userAgent);
  const installed = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  const refreshInstallVisibility = () => {
    // Em modo aplicativo, o botão não deve aparecer.
    installArea.hidden = installed() || localStorage.getItem('tudoEmDiaInstalled') === 'yes';
  };
  refreshInstallVisibility();
  window.addEventListener('beforeinstallprompt', event => {
    event.preventDefault(); installPrompt = event;
    // Se o navegador voltar a oferecer a instalação, não há instalação detectada neste contexto.
    localStorage.removeItem('tudoEmDiaInstalled'); refreshInstallVisibility();
  });
  window.addEventListener('appinstalled', () => { installPrompt = null; localStorage.setItem('tudoEmDiaInstalled','yes'); refreshInstallVisibility(); });
  window.matchMedia('(display-mode: standalone)').addEventListener?.('change', refreshInstallVisibility);
  window.addEventListener('pageshow', refreshInstallVisibility);
  btn.addEventListener('click', async () => {
    if (installed()) { guide.innerHTML = 'O <strong>Tudo em Dia</strong> já está aberto como aplicativo.'; }
    else if (installPrompt) {
      const prompt = installPrompt; installPrompt = null;
      await prompt.prompt();
      const result = await prompt.userChoice;
      if (result.outcome === 'accepted') { /* O evento appinstalled confirma a instalação quando disponível. */ }
      if (result.outcome !== 'accepted') guide.innerHTML = 'Para instalar depois, toque novamente no botão ou use a opção <strong>Instalar aplicativo</strong> do navegador.';
    } else if (isIOS) {
      guide.innerHTML = isSafari
        ? '<strong>Instalar no iPhone (Safari):</strong><br>1. Toque em <strong>Compartilhar</strong> (quadrado com seta para cima).<br>2. Role as opções e toque em <strong>Adicionar à Tela de Início</strong> (em algumas versões, em Mais ou no menu de ações).<br>3. Se aparecer <strong>Abrir como App</strong>, mantenha ativado; depois toque em <strong>Adicionar</strong>.<br>4. Abra o ícone de casa na Tela de Início.'
        : '<strong>Instalar no iPhone:</strong><br>1. Copie o endereço desta página e abra-o no <strong>Safari</strong>.<br>2. Toque em <strong>Compartilhar</strong> e depois em <strong>Adicionar à Tela de Início</strong>.<br>3. Confirme em <strong>Adicionar</strong> e abra o ícone na Tela de Início.';
    } else {
      guide.innerHTML = '<strong>Instalar no Android:</strong><br>1. Abra esta página no Chrome.<br>2. Toque no menu ⋮.<br>3. Selecione <strong>Instalar app</strong> ou <strong>Adicionar à tela inicial</strong>.<br>Se estiver no computador, abra o endereço do site no celular.';
    }
    guide.classList.add('show');
  });
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('./sw.js').catch(() => {});
</script>
</body>
</html>
